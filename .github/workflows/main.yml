name: Weekly Monarch Money Report

on:
  schedule:
    # Runs at 8:00 AM CST every Sunday (14:00 UTC)
    - cron: '0 14 * * 0'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  send-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      
      - name: Show file contents
        run: |
          echo "=== First 30 lines of monarch_report.py ==="
          head -30 monarch_report.py
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install monarchmoney python-dotenv gql==3.5.0
      
      - name: Run report
        env:
          MONARCH_EMAIL: ${{ secrets.MONARCH_EMAIL }}
          MONARCH_PASSWORD: ${{ secrets.MONARCH_PASSWORD }}
          MONARCH_MFA_SECRET: ${{ secrets.MONARCH_MFA_SECRET }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: python monarch_report.py
