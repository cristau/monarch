name: Weekly Monarch Money Report

on:
  schedule:
    # Runs at 8:00 AM CST every Sunday (14:00 UTC)
    - cron: '0 14 * * 0'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  send-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install monarchmoney python-dotenv gql==3.5.0
      
      - name: Fix Monarch API endpoint
        run: |
          # Find all monarchmoney.py files and fix them
          find /opt/hostedtoolcache -name "monarchmoney.py" -exec sed -i 's|api.monarchmoney.com|api.monarch.com|g' {} \;
          # Also check site-packages directly
          python -c "
          import monarchmoney
          import os
          pkg_dir = os.path.dirname(monarchmoney.__file__)
          target = os.path.join(pkg_dir, 'monarchmoney.py')
          print(f'Package dir: {pkg_dir}')
          print(f'Target file: {target}')
          with open(target, 'r') as f:
              content = f.read()
          content = content.replace('api.monarchmoney.com', 'api.monarch.com')
          with open(target, 'w') as f:
              f.write(content)
          print('Fix applied!')
          # Verify
          with open(target, 'r') as f:
              for line in f:
                  if 'BASE_URL' in line:
                      print(line.strip())
                      break
          "
      
      - name: Run report
        env:
          MONARCH_EMAIL: ${{ secrets.MONARCH_EMAIL }}
          MONARCH_PASSWORD: ${{ secrets.MONARCH_PASSWORD }}
          MONARCH_MFA_SECRET: ${{ secrets.MONARCH_MFA_SECRET }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: python monarch_report.py
