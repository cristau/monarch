# v3
name: Weekly Monarch Money Report

on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install monarchmoney python-dotenv gql==3.5.0
      
      - name: Run summary report
        env:
          MONARCH_EMAIL: ${{ secrets.MONARCH_EMAIL }}
          MONARCH_PASSWORD: ${{ secrets.MONARCH_PASSWORD }}
          MONARCH_MFA_SECRET: ${{ secrets.MONARCH_MFA_SECRET }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: |
          python << 'SCRIPT'
          import monarchmoney.monarchmoney as mm
          mm.MonarchMoneyEndpoints.BASE_URL = "https://api.monarch.com"
          exec(open("monarch_report.py").read())
          SCRIPT
      
      - name: Run detailed report
        env:
          MONARCH_EMAIL: ${{ secrets.MONARCH_EMAIL }}
          MONARCH_PASSWORD: ${{ secrets.MONARCH_PASSWORD }}
          MONARCH_MFA_SECRET: ${{ secrets.MONARCH_MFA_SECRET }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: |
          python << 'SCRIPT'
          import monarchmoney.monarchmoney as mm
          mm.MonarchMoneyEndpoints.BASE_URL = "https://api.monarch.com"
          exec(open("monarch_report_detailed.py").read())
          SCRIPT
